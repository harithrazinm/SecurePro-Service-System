
---
deployment:
  tasks:
    - export FRONTENDPATH=/home/sonicxco/public_html/sopro.my
    - export APPPATH=/home/sonicxco/securepro
    - /bin/cp -R admin assets css js pages super-admin technician "$FRONTENDPATH/"
    - /bin/cp index.html "$FRONTENDPATH/"
    - /bin/cp login.html "$FRONTENDPATH/"
    - /bin/mkdir -p "$APPPATH/backend/services" "$APPPATH/backend/uploads"
    - /bin/cp -R backend/config backend/controllers backend/middleware backend/routes "$APPPATH/backend/"
    - /bin/cp -R backend/services "$APPPATH/backend/"
    - /bin/cp backend/server.js backend/package.json backend/package-lock.json backend/migrateCloudinaryMedia.js "$APPPATH/backend/"
    - /bin/cp backend/data/services.js "$APPPATH/backend/data/"
    - /bin/cp backend/uploads/.htaccess "$APPPATH/backend/uploads/.htaccess"
