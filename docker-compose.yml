services:

  mysql:
    image: mysql:8.0
    container_name: securepro-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: securepro
      MYSQL_USER: securepro
      MYSQL_PASSWORD: securepro123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/sonic.sql:/docker-entrypoint-initdb.d/sonic.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "securepro",
          "-psecurepro123"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: securepro-backend

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "5001:5000"

    environment:
      PORT: 5000

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: securepro
      DB_USER: securepro
      DB_PASSWORD: securepro123

      JWT_SECRET: securepro-development-secret

    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads


volumes:
  mysql_data: