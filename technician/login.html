<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
<meta name="robots" content="noindex, nofollow, noarchive">

    <title>SecurePro | Technician Login</title>

      <link
    rel="icon"
    href="data:,"
>
    <link
        rel="stylesheet"
        href="css/technician-login.css"
    >

  

</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-brand">

                <div class="brand-mark">
                    S
                </div>

                <div>

                    <strong>
                        SECUREPRO
                    </strong>

                    <span>
                        System Solutions
                    </span>

                </div>

            </div>


            <div class="login-heading">

                <span>
    SECUREPRO INTERNAL SYSTEM
</span>

                <h1>
                    Welcome back
                </h1>

                <p>
    This portal is restricted to authorized SecurePro technicians.
    Sign in to access your assigned service requests.
</p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="technician@securepro.com"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <div
                    id="loginError"
                    class="login-error"
                    hidden
                ></div>


                <button
                    id="loginButton"
                    type="submit"
                >
                    Sign In
                </button>

            </form>
<p class="authorized-access">
    Authorized SecurePro technicians only.
</p>

            <div class="login-footer">
                SecurePro Technician Portal
            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
