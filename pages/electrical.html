<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/category-question.css">
    <link rel="stylesheet" href="../css/service-electrical-sync.css">
    <link rel="stylesheet" href="../css/category-enhance.css">
    <title>SOPro | Electrical Service</title>

   
</head>

<body>
<header class="site-header">
    <div class="container navbar">
        <a href="../index.html" class="brand">
            <img src="../assets/sopro-logo.png" alt="SOPro SecureOnePro" class="brand-logo">
        </a>

        <nav class="main-nav" id="mainNav">
            <a href="../index.html#why">Utama</a>
            <a href="../index.html#services">Senarai Servis</a>
            <a href="../index.html#help">Hubungi Kami</a>
        </nav>

        <div class="nav-actions">
            <button id="languageToggle" class="language-btn" type="button">🌐 English</button>
            <button class="menu-toggle" id="menuToggle" type="button"
                    aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</header>

<main class="category-question-page">
    <div class="container">

        <div class="category-question-header">
            <span class="eyebrow">NEW SYSTEM · ELECTRICAL SERVICE</span>
            <h1>Electrical Service</h1>
            <p data-i18n="intro">
                Beritahu kami keperluan kerja elektrik anda.
            </p>

            <div class="electrical-note">
                Soalan akan dipaparkan satu per satu. Soalan tambahan akan
                berubah mengikut jenis kerja elektrik yang dipilih.
            </div>
        </div>

        <div class="category-progress" aria-label="Request progress">
            <div class="progress-step active">
                <span class="progress-dot">01</span>
                <span data-progress-label="questions">Questions</span>
            </div>
            <div class="progress-step">
                <span class="progress-dot">02</span>
                <span data-progress-label="customer">Customer Details</span>
            </div>
            <div class="progress-step">
                <span class="progress-dot">03</span>
                <span data-progress-label="review">Review</span>
            </div>
            <div class="progress-step">
                <span class="progress-dot">04</span>
                <span data-progress-label="submit">Submit</span>
            </div>
        </div>

        <form id="questionForm" class="question-form">
            <div id="categoryQuestions"></div>
        </form>

    </div>
</main>

<script src="../js/category-form.js"></script>
<script src="../js/electrical.js"></script>
</body>
</html>
