<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPro | Service Selection</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/service.css">
<link rel="stylesheet" href="../css/service-enhance.css">
</head>

<body>

<header class="site-header">
    <div class="container navbar">

        <a href="../index.html" class="brand" aria-label="SOPro SecureOnePro">
            <img src="../assets/sopro-logo.png" alt="SOPro SecureOnePro" class="brand-logo">
        </a>

        <nav class="main-nav" id="mainNav">
            <a href="../index.html#why">Utama</a>
            <a href="../index.html#services">Senarai Servis</a>
            <a href="../index.html#help">Hubungi Kami</a>
        </nav>

        <div class="nav-actions">
            <button id="languageToggle" class="language-btn" type="button">🌐 English</button>
            <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>

    </div>
</header>


<main class="question-page">
    <div class="container">

        <!-- SERVICE HEADER -->
        <section class="question-header">
            <span class="eyebrow" id="serviceEyebrow">SOPRO</span>
            <h1 id="serviceTitle">Loading...</h1>
            <p id="serviceDescription">Please wait while we load the questions.</p>
        </section>

        <!-- REQUEST STEPS (same as the other category pages) -->
        <div class="category-progress" aria-label="Request progress">
            <div class="progress-step active"><span class="progress-dot">01</span><span data-i18n="stepQuestions">Questions</span></div>
            <div class="progress-step"><span class="progress-dot">02</span><span data-i18n="stepCustomer">Customer Details</span></div>
            <div class="progress-step"><span class="progress-dot">03</span><span data-i18n="stepReview">Review</span></div>
            <div class="progress-step"><span class="progress-dot">04</span><span data-i18n="stepSubmit">Submit</span></div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-area">
            <div class="progress-info">
                <span id="progressText">Question 1 of 1</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <!-- QUESTION -->
        <section id="questionContainer" class="question-container">
            <div class="question-loading">Loading questions...</div>
        </section>

        <!-- NAVIGATION -->
        <div class="question-navigation">
            <button id="previousButton" class="secondary-btn" type="button">
                ←
                <span data-i18n="previous">Previous</span>
            </button>

            <button id="nextButton" class="primary-btn" type="button">
                <span data-i18n="next">Next</span>
                →
            </button>
        </div>

    </div>
</main>

<script src="../js/service.js"></script>

</body>
</html>
